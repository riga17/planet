<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planets</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            color: white;

            background-image:
                linear-gradient(
                    rgba(4, 7, 30, 0.55),
                    rgba(15, 4, 40, 0.75)
                ),
                url("planet.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        /* NAVBAR */

        .navbar {
            width: 100%;
            height: 90px;

            display: flex;
            align-items: center;
            justify-content: flex-end;

            padding-right: 60px;
        }


        .nav-links {
            display: flex;
            flex-direction: row;
            list-style: none;
            gap: 45px;
        }


        .nav-links a {
            text-decoration: none;
            color: white;

            font-size: 16px;
            letter-spacing: 1px;

            transition: 0.3s;
        }


        .nav-links a:hover {
            color: #9f8cff;
        }



        /* CENTER TEXT */

        .hero {
            height: calc(100vh - 90px);

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }


        .hero-content {
            max-width: 850px;
        }


        .small-title {
            font-size: 13px;

            letter-spacing: 6px;

            color: #b8a7ff;

            margin-bottom: 20px;
        }


        h1 {
            font-size: 65px;

            font-weight: 500;

            line-height: 1.1;

            margin-bottom: 20px;
        }


        .description {
            font-size: 17px;

            color: #dddddd;

            margin-bottom: 30px;
        }


        .button {
            display: inline-block;

            padding: 13px 30px;

            border: 1px solid #a38cff;

            border-radius: 30px;

            text-decoration: none;

            color: white;

            letter-spacing: 2px;

            transition: 0.3s;
        }


        .button:hover {
            background-color: #7b61ff;
        }



        /* PHONE */

        @media (max-width: 700px) {

            .navbar {
                padding-right: 20px;
            }

            .nav-links {
                gap: 18px;
            }

            .nav-links a {
                font-size: 13px;
            }

            h1 {
                font-size: 40px;
            }

        }

    </style>

</head>


<body>


    <div class="navbar">

        <ul class="nav-links">

            <li>
                <a href="AboutUs.html">AboutUs</a>
            </li>

            <li>
                <a href="Game.html">Game</a>
            </li>

            <li>
                <a href="Quiz.html">Quiz</a>
            </li>

        </ul>

    </div>



    <div class="hero">

        <div class="hero-content">

            <p class="small-title">
                EXPLORE THE UNIVERSE
            </p>

            <h1>
                Worlds Beyond<br>
                Our Own.
            </h1>

            <p class="description">
                Discover the planets of our solar system.
            </p>

            <a href="Planets.html" class="button">
                EXPLORE
            </a>

        </div>

    </div>


</body>

</html>
